<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CONDCRED</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="theme-color" content="#224733">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CONDCRED">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --green:#224733; --green-2:#2F5E45; --gold:#C89A4D; --gold-soft:#F3E6CE; --cream:#FEFAF6;
  --bg:#F7F2EA; --surface:#FEFAF6; --paper:#F1EADF; --ink:#1C2B22; --muted:#5C6A61; --line:#E4DACB;
  --red:#A9442F; --red-soft:#F6E1DA; --ok:#2F6B4A; --ok-soft:#DDEBE1; --warn:#9A6B1E; --warn-soft:#F5E9D3;
  --shadow:0 1px 0 rgba(34,71,51,.06), 0 8px 24px -16px rgba(34,71,51,.25);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10201A; --surface:#172A21; --paper:#13251C; --ink:#F2ECE2; --muted:#A7B3AB; --line:#2A4033;
    --green-2:#8CC2A2; --gold-soft:#3A3121; --red:#E08A74; --red-soft:#3A2420; --ok:#8CC2A2; --ok-soft:#1E3A2B; --warn:#E0B872; --warn-soft:#3A3121;
    --shadow:0 1px 0 rgba(0,0,0,.2), 0 10px 26px -18px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#10201A; --surface:#172A21; --paper:#13251C; --ink:#F2ECE2; --muted:#A7B3AB; --line:#2A4033;
  --green-2:#8CC2A2; --gold-soft:#3A3121; --red:#E08A74; --red-soft:#3A2420; --ok:#8CC2A2; --ok-soft:#1E3A2B; --warn:#E0B872; --warn-soft:#3A3121;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 "Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,.num{font-family:Montserrat,"Source Sans 3",system-ui,sans-serif}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
img{max-width:100%}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:22px;padding:26px 18px 20px;background:var(--surface);border-right:1px solid var(--line)}
.brand{display:block;background:var(--cream);border-radius:12px;padding:10px 12px}
.brand img{display:block;width:100%;height:auto}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;background:none;border:0;padding:10px 12px;border-radius:9px;color:var(--muted);font-weight:500}
.nav button:hover{background:var(--paper);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--green);color:var(--cream)}
:root[data-theme="dark"] .nav button[aria-current="page"]{color:#fff}
.nav .count{font:600 12px/1 Montserrat,sans-serif;padding:4px 7px;border-radius:20px;background:var(--red);color:#fff}
.side-foot{margin-top:auto;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:10px}
.save{display:flex;align-items:center;gap:8px}
.save i{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.save.busy i{background:var(--gold);animation:pulse 1s infinite}
.save.err i{background:var(--red)}
@keyframes pulse{50%{opacity:.35}}
.theme-toggle{align-self:flex-start;background:none;border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:13px;color:var(--muted)}

main{min-width:0;padding:30px clamp(16px,3.2vw,44px) 60px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px}
.top h1{margin:0;font-size:clamp(22px,2.4vw,30px);font-weight:700;color:var(--green);letter-spacing:-.01em}
:root[data-theme="dark"] .top h1{color:var(--cream)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .top h1{color:var(--cream)}}
.top p{margin:4px 0 0;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:9px 14px;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--green-2)}
.btn.primary{background:var(--green);border-color:var(--green);color:var(--cream)}
.btn.primary:hover{background:#1A3828}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#23180A}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.small{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.danger{color:var(--red)}
.btn svg{width:16px;height:16px}

.demo-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;background:var(--gold-soft);border:1px dashed var(--gold);border-radius:12px;padding:10px 14px;margin-bottom:20px;font-size:14px}

/* ---------- ledger (KPIs) ---------- */
.ledger{display:grid;grid-template-columns:1.5fr repeat(4,1fr);background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.ledger > div{padding:18px 20px;border-left:1px solid var(--line);min-width:0}
.ledger > div:first-child{border-left:0;background:var(--green);color:var(--cream)}
.ledger .k{font-size:13px;color:var(--muted);margin-bottom:6px}
.ledger > div:first-child .k{color:#CFE0D5}
.ledger .v{font:700 clamp(18px,1.8vw,24px)/1.15 Montserrat,sans-serif;font-variant-numeric:tabular-nums;white-space:nowrap}
.ledger > div:first-child .v{font-size:clamp(24px,2.6vw,34px);color:var(--cream)}
.ledger .s{font-size:12.5px;color:var(--muted);margin-top:6px}
.ledger > div:first-child .s{color:#E7D3AE}
.ledger .v.red{color:var(--red)}

/* ---------- panels ---------- */
.grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:18px;margin-top:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:20px;min-width:0}
.panel h2{margin:0;font-size:16px;font-weight:700}
.panel-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.panel-head p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.seg{display:inline-flex;background:var(--paper);border-radius:9px;padding:3px}
.seg button{border:0;background:none;padding:5px 10px;border-radius:7px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

.chart-wrap{position:relative}
.chart{width:100%;height:auto;display:block;overflow:visible}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:13px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:14px;height:10px;border-radius:2px}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:13px;line-height:1.4;padding:8px 10px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .12s}
.tip b{font-family:Montserrat,sans-serif}

.rows{list-style:none;margin:0;padding:0}
.rows li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.rows li:first-child{border-top:0}
.rows .t{font-weight:600}
.rows .d{font-size:13px;color:var(--muted)}
.rows .r{text-align:right;flex:none}

/* ---------- tables ---------- */
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.search{flex:1 1 220px;max-width:360px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px}
.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font:600 12.5px/1.3 "Source Sans 3",sans-serif;color:var(--muted);text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--paper)}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td:first-child{min-width:170px}
.drawer td:first-child{min-width:0}
.cfm{width:min(420px,calc(100% - 24px))}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--paper)}
.sub{display:block;font-size:12.5px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap}
.chip.pago{background:var(--ok-soft);color:var(--ok)}
.chip.aberto{background:var(--warn-soft);color:var(--warn)}
.chip.atrasado{background:var(--red-soft);color:var(--red)}
.chip.quitada{background:var(--ok-soft);color:var(--ok)}
.bar{height:6px;border-radius:6px;background:var(--paper);overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green) 0%,var(--green) 70%,var(--gold) 100%)}
.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty h3{margin:0 0 6px;color:var(--ink);font-size:18px}
.empty .actions{justify-content:center;margin-top:16px}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:12px}
.card h3{margin:0;font-size:16px}
.card dl{display:grid;grid-template-columns:1fr auto;gap:6px 12px;margin:0;font-size:14px}
.card dt{color:var(--muted)}
.card dd{margin:0;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.card .foot{display:flex;gap:8px;margin-top:auto;padding-top:6px;border-top:1px solid var(--line)}
.alert-line{font-size:13px;color:var(--red);font-weight:600}

/* ---------- drawer & dialog ---------- */
.scrim{position:fixed;inset:0;background:rgba(16,32,26,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--bg);z-index:21;transform:translateX(100%);transition:transform .25s cubic-bezier(.22,1,.36,1);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.on{transform:none}
.drawer-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:20px 22px;border-bottom:1px solid var(--line);background:var(--surface)}
.drawer-head h2{margin:0;font-size:19px;color:var(--green)}
:root[data-theme="dark"] .drawer-head h2{color:var(--cream)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .drawer-head h2{color:var(--cream)}}
.drawer-body > *{flex:none}
.drawer-body{flex:1;min-height:0;overflow-y:auto;padding:20px 22px 40px;display:flex;flex-direction:column;gap:18px}
.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.facts div{background:var(--surface);padding:12px 14px}
.facts .k{font-size:12.5px;color:var(--muted)}
.facts .v{font:600 16px/1.3 Montserrat,sans-serif;font-variant-numeric:tabular-nums}
.facts .full{grid-column:1/-1}
.x{background:none;border:0;font-size:24px;line-height:1;color:var(--muted);padding:4px 8px}
.sect-title{display:flex;justify-content:space-between;align-items:center;gap:10px}
.bd-prem,.bd-res{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.bd-prem>div,.bd-res>div{display:flex;justify-content:space-between;gap:10px;background:var(--surface);padding:9px 12px;font-size:14px}
.bd-prem span,.bd-res span{color:var(--muted)}
.bd-prem b,.bd-res b{font-variant-numeric:tabular-nums;white-space:nowrap}
.bd-res .bd-liq{grid-column:1/-1;background:var(--gold-soft)}
.bd-res .bd-liq span{color:var(--ink);font-weight:700}
.bd-res .bd-liq b{font-size:17px;color:var(--green)}
.bd-tab th,.bd-tab td{white-space:nowrap}
@media (max-width:560px){.bd-prem,.bd-res{grid-template-columns:1fr}}
.sect-title h3{margin:0;font-size:15px}
.inline-date{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 6px;font-size:13px}

dialog{border:0;border-radius:18px;padding:0;width:min(620px,calc(100% - 24px));max-height:calc(100% - 40px);background:var(--surface);color:var(--ink);box-shadow:0 30px 80px -30px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(16,32,26,.5)}
.dlg-head{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line)}
.dlg-head h2{margin:0;font-size:18px}
.dlg-body{padding:18px 22px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px 18px}
.dlg-body .full{grid-column:1/-1}
.dlg-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 22px;border-top:1px solid var(--line);background:var(--paper)}
label.f{display:flex;flex-direction:column;justify-content:flex-end;gap:6px;min-width:0;font-size:13px;font-weight:600;color:var(--muted)}
label.f input,label.f select,label.f textarea{box-sizing:border-box;min-width:0;max-width:100%;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:9px 12px;font-weight:400;font-size:16px;line-height:1.35;color:var(--ink);width:100%;font-family:inherit}
label.f input,label.f select{height:46px}
label.f input[type=date]{-webkit-appearance:none;appearance:none;display:block;text-align:left}
label.f input[type=date]::-webkit-date-and-time-value{text-align:left;margin:0}
label.f input[type=date]::-webkit-datetime-edit{padding:0}
label.f input:focus,label.f select:focus,label.f textarea:focus{outline:2px solid var(--gold);outline-offset:0;border-color:var(--gold)}
.preview{grid-column:1/-1;display:grid;grid-template-columns:repeat(2,1fr);gap:10px;background:var(--gold-soft);border-radius:12px;padding:12px 14px}
.preview .k{font-size:12px;color:var(--muted)}
.preview .v{font:700 16px/1.3 Montserrat,sans-serif;font-variant-numeric:tabular-nums}
.hint{grid-column:1/-1;font-size:12.5px;color:var(--muted);margin:-4px 0 0}
.fieldset-title{grid-column:1/-1;margin:6px 0 -4px;font:700 13px/1 Montserrat,sans-serif;color:var(--green-2)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--green);color:var(--cream);padding:10px 16px;border-radius:10px;font-weight:600;opacity:0;transition:.2s;z-index:40;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- filtros ---------- */
.filters{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:-6px 0 18px;box-shadow:var(--shadow)}
.fl{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600;color:var(--muted);flex:0 1 210px;min-width:150px}
.fl.grow{flex:1 1 260px}
.fl input,.fl select{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:8px 10px;font-size:14px;font-weight:400;color:var(--ink);width:100%}
.fl select:not([value=""]){}
.fl input:focus,.fl select:focus{outline:2px solid var(--gold);outline-offset:0;border-color:var(--gold)}
.filters .clear{margin-left:auto;color:var(--red)}

/* ---------- KPIs ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi .kl{font-size:13px;color:var(--muted);font-weight:600}
.kpi .kv{font:700 21px/1.15 Montserrat,sans-serif;font-variant-numeric:tabular-nums;color:var(--ink)}
.kpi .kn{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.kbar{height:5px;border-radius:5px;background:var(--paper);overflow:hidden}
.kbar i{display:block;height:100%;background:var(--green-2)}
.kpi.hl{background:var(--gold-soft);border-color:var(--gold)}
.kpi.good .kv{color:var(--ok)} .kpi.good .kbar i{background:var(--ok)}
.kpi.mid .kv{color:var(--warn)} .kpi.mid .kbar i{background:var(--gold)}
.kpi.bad .kv{color:var(--red)} .kpi.bad .kbar i{background:var(--red)}

/* ---------- painel completo ---------- */
.jump{display:flex;flex-wrap:wrap;gap:8px;margin:28px 0 0;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line)}
.jump a{font-size:13.5px;font-weight:600;color:var(--green-2);text-decoration:none;padding:6px 12px;border:1px solid var(--line);border-radius:20px;background:var(--surface)}
.jump a:hover{border-color:var(--gold)}
.embed{margin-top:30px;scroll-margin-top:70px}
.sec-head{margin-bottom:12px}
.sec-head h2{margin:0;font-size:19px;color:var(--green)}
.sec-head p{margin:2px 0 0;font-size:13.5px;color:var(--muted)}
:root[data-theme="dark"] .sec-head h2{color:var(--cream)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sec-head h2{color:var(--cream)}}
.embed .table-wrap{max-height:460px;overflow:auto}
.embed th{position:sticky;top:0;z-index:1}

/* ---------- segurança / validação ---------- */
.err{grid-column:1/-1;margin:0;color:var(--red);font-weight:600;font-size:14px;min-height:0}
.err:empty{display:none}
.check{grid-column:1/-1;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;background:var(--paper);border-radius:10px;padding:10px 12px}
.check input{width:18px;height:18px;accent-color:var(--green)}
.warn-box{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:14px}
.lock{margin-top:10vh}
.pin-box form{display:flex;flex-direction:column;gap:12px;max-width:340px;margin:16px auto 0}
.pin-box .pin-logo{width:72px;height:auto;display:block;margin:0 auto 8px}
.pin-box #pin{font:600 22px/1.2 Montserrat,system-ui,sans-serif;letter-spacing:.3em;text-align:center;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.pin-box #srv{font:14px/1.3 system-ui,sans-serif;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.pin-box .btn{justify-content:center}
.pin-box .err{min-height:1.2em}
.pin-box .lembrar{font-size:14px;color:var(--muted);display:flex;gap:8px;align-items:center;justify-content:center}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;font:inherit;font-size:14px;cursor:pointer}
body.is-locked .side-foot{display:none}
body.discreto .num, body.discreto td.n, body.discreto .v, body.discreto .kv, body.discreto .kn, body.discreto .rows .r,
body.discreto .card dd, body.discreto .ledger .s, body.discreto .chart text, body.discreto .chart rect:not(.hit), body.discreto .chart path, body.discreto .tip, body.discreto .alert-line{filter:blur(7px);user-select:none}

/* ---------- responsive ---------- */
@media (max-width:1100px){
  .ledger{grid-template-columns:repeat(2,1fr)}
  .ledger > div{border-left:0;border-top:1px solid var(--line)}
  .ledger > div:first-child{grid-column:1/-1;border-top:0}
  .ledger > div:nth-child(odd):not(:first-child){border-left:1px solid var(--line)}
  .grid2{grid-template-columns:1fr}
}
@media (max-width:820px){
  .jump{top:calc(62px + env(safe-area-inset-top,0px))}
  .fl{flex:1 1 140px}
  .app{grid-template-columns:minmax(0,1fr)}
  .side,.nav{min-width:0}
  .side{position:sticky;top:0;z-index:10;height:auto;flex-direction:row;align-items:center;gap:12px;padding:10px 12px;border-right:0;border-bottom:1px solid var(--line);padding-top:calc(10px + env(safe-area-inset-top,0px))}
  .brand{width:52px;padding:6px;flex:none}
  .brand .full{display:none}
  .brand .icon{display:block!important}
  .nav{flex-direction:row;overflow-x:auto;gap:4px;scrollbar-width:none}
  .nav button{white-space:nowrap;padding:8px 11px;font-size:14px}
  .side-foot{display:flex;margin:0 0 0 auto;flex:none}
  .side-foot .theme-toggle{display:none}
  .save span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .save i{width:10px;height:10px}
  main{padding-top:20px}
  .dlg-body{grid-template-columns:1fr}
  .preview{grid-template-columns:1fr 1fr}
  .facts{grid-template-columns:1fr 1fr}
}
@media (max-width:480px){
  .ledger{grid-template-columns:1fr}
  .ledger > div:nth-child(odd):not(:first-child){border-left:0}
  .preview{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

/* ================= regras do contrato ================= */
// Cláusula XIII: multa 2% sobre o débito + juros de 1% a.m. pro rata die.
const MULTA = 0.02, JUROS_AM = 0.01;
// IOF-Crédito em factoring (Decreto 6.306/2007, art. 7º, alíquotas do Decreto 12.499/2025):
// alíquota diária sobre o valor líquido de cada parcela, da antecipação ao vencimento (máx. 365 dias), mais adicional de 0,95% (definido pela CONDCRED).
// O IOF é custo da CONDCRED (ela recolhe ao Tesouro e não desconta do prestador). A tarifa por operação é descontada do prestador.
const IOF = {pj: 0.000082, pf: 0.000082, simples: 0.0000274, adicional: 0.0095, limiteSimples: 30000};
const TARIFA_PADRAO = 150;
const IOF_REG = {pj: "Pessoa jurídica", simples: "Simples Nacional / MEI", pf: "Pessoa física", isento: "Sem IOF"};
const IOF_PAG = {condcred: "CONDCRED", prestador: "Prestador"};
const r2 = v => Math.round((+v || 0) * 100) / 100;
// Borderô: cada parcela é descontada pela taxa ao mês, em juros simples pro rata die (dias/30).
// A base do IOF de cada parcela é o valor dela menos os juros; IOF = base × (alíquota diária × dias, até 365) + base × adicional.
function bordero(data, lista, nominal, desPct, regime, tx){
  const out = {linhas: [], juros: 0, diario: 0, adicional: 0, total: 0, dia: 0, ad: 0, taxaMes: 0};
  if (!data) return out;
  const pz = prazoMedio(data, lista), tm = pz > 0 ? (+desPct || 0) / 100 / pz : 0;
  out.taxaMes = tm;
  const isento = regime === "isento" || !IOF_REG[regime];
  const base0 = (+nominal || 0) * (1 - (+desPct || 0) / 100);
  out.dia = isento ? 0 : (regime === "simples" && base0 <= IOF.limiteSimples ? IOF.simples : IOF[regime]);
  out.ad = isento ? 0 : IOF.adicional;
  if (tx && (tx.dia || tx.ad)){ out.dia = tx.dia || 0; out.ad = tx.ad || 0; }
  lista.forEach(([v, venc]) => {
    v = +v || 0; if (v <= 0) return;
    const dias = venc ? daysBetween(data, venc) : 0;
    const juros = r2(pz > 0 ? v * tm * dias / 30 : v * (+desPct || 0) / 100);
    const base = r2(v - juros);
    const iofD = r2(base * out.dia * Math.min(365, dias)), iofA = r2(base * out.ad);
    const iof = r2(iofD + iofA);
    out.linhas.push({v, venc, dias, juros, base, iofD, iofA, iof});
    out.juros += juros; out.diario += iofD; out.adicional += iofA; out.total += iof;
  });
  ["juros", "diario", "adicional", "total"].forEach(k => out[k] = r2(out[k]));
  return out;
}
function borderoOp(op){ return bordero(op.data, (op.boletos||[]).map(b => [b.valor, b.vencimento]), op.valorNominal, op.desagioPct, op.iofRegime, op.iof ? {dia: op.iofTaxaDia, ad: op.iofTaxaAd} : null); }
function calcIOF(data, lista, nominal, desPct, regime){ return bordero(data, lista, nominal, desPct, regime).total; }
function statusBoleto(b){ if (b.pagoEm) return "pago"; return (b.vencimento && b.vencimento < today()) ? "atrasado" : "aberto"; }
function encargos(b){
  const ref = b.pagoEm || today();
  if (!b.vencimento || ref <= b.vencimento) return {dias:0, multa:0, juros:0, total:0};
  const dias = daysBetween(b.vencimento, ref);
  const multa = b.valor * MULTA, juros = b.valor * JUROS_AM * dias / 30;
  return {dias, multa, juros, total: multa + juros};
}
// prazo médio (em meses de 30 dias) entre a antecipação e o vencimento de cada parcela, ponderado pelo valor.
// Taxa ao mês x prazo médio = deságio total (desconto simples de cada parcela pelo seu próprio prazo).
function prazoMedio(data, lista){
  if (!data) return 0; let pv = 0, pw = 0;
  lista.forEach(([v, venc]) => { v = +v || 0; if (!venc || v <= 0) return; pw += v * daysBetween(data, venc) / 30; pv += v; });
  return pv ? pw / pv : 0;
}
const pctIn = v => (+v || 0).toLocaleString("pt-BR", {maximumFractionDigits:4, useGrouping:false});
function calcOp(op){
  const nominal = +op.valorNominal || 0;
  const antecipado = nominal * (1 - (+op.desagioPct||0)/100);
  const desagio = nominal - antecipado;
  let recebido = 0, aberto = 0, atrasado = 0, encargosTot = 0, qtdAtr = 0, pagos = 0;
  (op.boletos||[]).forEach(b => {
    const st = statusBoleto(b), e = encargos(b);
    if (st === "pago"){ recebido += (b.valorPago != null ? +b.valorPago : b.valor + e.total); pagos++; encargosTot += e.total; }
    else { aberto += b.valor; if (st === "atrasado"){ atrasado += b.valor; qtdAtr++; encargosTot += e.total; } }
  });
  const totalFinal = nominal + encargosTot;
  const qtd = (op.boletos||[]).length;
  const progresso = qtd ? pagos / qtd : 0;
  const status = qtd && pagos === qtd ? "quitada" : (qtdAtr ? "atrasado" : "aberto");
  const prazo = prazoMedio(op.data, (op.boletos||[]).map(b => [b.valor, b.vencimento]));
  const taxaMes = prazo > 0 ? (+op.desagioPct||0) / prazo : 0;
  const iof = +op.iof || 0, tarifa = +op.tarifa || 0;
  const iofPrest = op.iofPagador === "prestador";
  const liquido = antecipado - tarifa - (iofPrest ? iof : 0);   // o que o prestador efetivamente recebe
  const receita = desagio + tarifa - (iofPrest ? 0 : iof);      // resultado da CONDCRED (o IOF só pesa se ela pagar)
  const capital = liquido + iof;                  // saída de caixa da CONDCRED (prestador + IOF recolhido)
  const iofDiario = +op.iofDiario || 0, iofAdicional = op.iofAdicional != null ? +op.iofAdicional || 0 : Math.max(0, iof - iofDiario);
  return {nominal, antecipado, desagio, recebido, aberto, atrasado, encargosTot, totalFinal, qtdAtr, pagos, qtd, progresso, status, prazo, taxaMes, iof, tarifa, liquido, receita, capital, iofDiario, iofAdicional, iofPrest};
}

function cleanParty(o){ return {id: idOk(o.id), nome: str(o.nome) || "Sem nome", doc: str(o.doc), contato: str(o.contato), sindico: str(o.sindico)}; }
function cleanOp(o){

  return {id: idOk(o.id), clienteId: idOk(o.clienteId), condoId: idOk(o.condoId), servico: str(o.servico), obs: str(o.obs), data: isoOk(o.data), criadoEm: isoOk(o.criadoEm),
    valorNominal: n(o.valorNominal), desagioPct: Math.min(99.99, Math.max(0, n(o.desagioPct))),
    iof: Math.max(0, n(o.iof)), iofDiario: Math.max(0, n(o.iofDiario)), iofAdicional: Math.max(0, n(o.iofAdicional)), iofTaxaDia: Math.max(0, n(o.iofTaxaDia)), iofTaxaAd: Math.max(0, n(o.iofTaxaAd)),

    boletos: (Array.isArray(o.boletos) ? o.boletos : []).slice(0, 240).map(b => { const x = {id: idOk(b.id) || uid("b"), numero: str(b.numero).slice(0,20), vencimento: isoOk(b.vencimento), valor: n(b.valor)}; if (isoOk(b.pagoEm)){ x.pagoEm = b.pagoEm; if (b.valorPago != null && b.valorPago !== "") x.valorPago = n(b.valorPago); } return x; }),
    nfs: (Array.isArray(o.nfs) ? o.nfs : []).slice(0, 100).map(x => ({id: idOk(x.id) || uid("nf"), tipo: x.tipo === "condominio" ? "condominio" : "prestador", numero: str(x.numero).slice(0,40), data: isoOk(x.data), valor: x.valor ? n(x.valor) : null}))};
}
function cleanAll(o){
  const out = {clientes:{}, condos:{}, ops:{}};
  Object.values(o.clientes||{}).forEach(c => { c = cleanParty(c); if (c.id) out.clientes[c.id] = c; });
  Object.values(o.condos||{}).forEach(c => { c = cleanParty(c); if (c.id) out.condos[c.id] = c; });
  Object.values(o.ops||{}).forEach(c => { c = cleanOp(c); if (c.id) out.ops[c.id] = c; });

function loadLocal(){ try { const raw = localStorage.getItem(LS); if (raw) S = cleanAll(JSON.parse(raw)); } catch(e){} }
function saveLocal(){ if (mode !== "local") return; try { localStorage.setItem(LS, JSON.stringify(S)); } catch(e){} }
function dropLocal(){ try { localStorage.removeItem(LS); } catch(e){} }
function bucket(kind){ return kind === "cliente" ? "clientes" : kind === "condo" ? "condos" : "ops"; }

function setSave(state, text){
  const el = $("#save"); el.className = "save" + (state === "busy" ? " busy" : state === "err" ? " err" : "");
  el.querySelector("span").textContent = text;
  el.title = text;
}
function savedLabel(){ return mode === "app" ? "Salvo na sua planilha" : "Salvo automaticamente neste navegador"; }

function persist(kind, obj){
  if (demo){ demo[bucket(kind)][obj.id] = obj; render(); return; }
  S[bucket(kind)][obj.id] = obj; saveLocal(); render();
  if (locked) return;
  if (!col) { setSave("ok", savedLabel()); return; }
  setSave("busy", "Salvando…");
  const body = JSON.parse(JSON.stringify(Object.assign({}, obj, {kind})));
  writeChain[obj.id] = (writeChain[obj.id] || Promise.resolve()).then(() => col.doc(obj.id).set(body))
    .then(() => { if (kind === "op" && ARQ_IDX[obj.id]) return tirarDoArquivo(obj.id); })
    .then(() => setSave("ok", savedLabel()))
    .catch(e => { const m = e && e.code === "quota_exceeded" ? "Limite de registros atingido" : "Não foi salvo — verifique a conexão e repita"; setSave("err", m); toast(m); });
}
function removeItem(kind, id){
  if (demo){ delete demo[bucket(kind)][id]; render(); return; }
  const orig = S[bucket(kind)][id];
  delete S[bucket(kind)][id]; saveLocal(); render();
  if (!col || !orig) return;
  const lx = {kind: "lixo", origKind: kind, orig: JSON.parse(JSON.stringify(orig)), excluidoEm: new Date().toISOString()};
  LIXO["lx_" + id] = lx;
  setSave("busy", "Salvando…");
  // primeiro guarda na lixeira; só depois apaga o original
  writeChain[id] = (writeChain[id] || Promise.resolve()).then(() => col.doc("lx_" + id).set(lx)).then(() => ARQ_IDX[id] ? tirarDoArquivo(id) : col.doc(id).delete())
    .then(() => setSave("ok", savedLabel())).catch(() => setSave("err", "Falha ao excluir — tente de novo"));
}
function tirarDoArquivo(opId){
  const cid = ARQ_IDX[opId]; if (!cid || !arq) return Promise.resolve();
  delete ARQ_IDX[opId];
  const resto = (CHUNKS[cid] || []).filter(o => o.id !== opId); CHUNKS[cid] = resto;
  return (writeChain[cid] = (writeChain[cid] || Promise.resolve()).then(() => resto.length ? arq.doc(cid).set({kind: "arquivo", ops: JSON.parse(JSON.stringify(resto))}) : arq.doc(cid).delete()));
}
function juntar(){
  const ops = {};
  Object.entries(CHUNKS).forEach(([cid, list]) => list.forEach(op => { ops[op.id] = op; }));
  Object.assign(ops, BASE.ops); // a versão ativa sempre vence
  S = {clientes: BASE.clientes, condos: BASE.condos, ops};
}
async function arquivarAntigas(){
  if (!souDono || !arq) return;
  const lim = Date.now() - 180 * 864e5;
  const cand = Object.values(BASE.ops).filter(op => {
    if (!op.boletos.length || calcOp(op).status !== "quitada") return false;
    const ult = op.boletos.reduce((m, b) => (b.pagoEm || "") > m ? b.pagoEm : m, "");
    return ult && Date.parse(ult) < lim;
  }).slice(0, 400);
  if (cand.length < 5) return; // só compensa agrupar a partir de algumas operações
  const grupos = []; let cur = [], tam = 0;
  cand.forEach(op => { const n = JSON.stringify(op).length; if (cur.length && tam + n > 180000){ grupos.push(cur); cur = []; tam = 0; } cur.push(op); tam += n; });
  if (cur.length) grupos.push(cur);
  try {
    for (let i = 0; i < grupos.length; i++){
      const cid = "a_" + Date.now().toString(36) + "_" + i;
      await arq.doc(cid).set({kind: "arquivo", ops: JSON.parse(JSON.stringify(grupos[i]))}); // primeiro grava o arquivo…
      for (const op of grupos[i]) if (!writeChain[op.id]) await col.doc(op.id).delete();       // …só depois apaga o registro avulso
    }
  } catch(e){ console.warn("arquivo", e); }
}
function restaurar(lxId){
  const lx = LIXO[lxId]; if (!lx || !col) return;
  delete LIXO[lxId];
  persist(lx.origKind, lx.orig);
  // se for antecipação, restaura também prestador/condomínio que tenham sido excluídos
  if (lx.origKind === "op") [["cliente", lx.orig.clienteId], ["condo", lx.orig.condoId]].forEach(([k, pid]) => { const l2 = LIXO["lx_" + pid]; if (l2 && !S[bucket(k)][pid]){ delete LIXO["lx_" + pid]; persist(k, l2.orig); col.doc("lx_" + pid).delete().catch(() => {}); } });
  writeChain[lxId] = (writeChain[lxId] || Promise.resolve()).then(() => col.doc(lxId).delete()).catch(() => {});
  toast("Restaurado");
}
function lixoNome(lx){ const o = lx.orig || {}; if (lx.origKind === "op") return (cliName(o.clienteId) !== "—" ? cliName(o.clienteId) : (LIXO["lx_" + o.clienteId] ? LIXO["lx_" + o.clienteId].orig.nome : "Prestador")) + " · " + brl(o.valorNominal) + (o.servico ? " · " + o.servico : ""); return (lx.origKind === "cliente" ? "Prestador: " : "Condomínio: ") + (o.nome || "—"); }
function lixeiraForm(){

  openDlg(dlgShell("Lixeira", itens.length ? `<p class="full" style="margin:0">Tudo o que for excluído fica aqui por 30 dias e pode ser restaurado.</p>
    <div class="full" style="display:flex;flex-direction:column;gap:8px">${itens.map(([id, lx]) => `<div style="display:flex;gap:10px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:10px;padding:10px 12px"><div><strong>${esc(lixoNome(lx))}</strong><div class="muted" style="font-size:13px">Excluído em ${fmtD((lx.excluidoEm || "").slice(0, 10))}</div></div><button type="button" class="btn small" data-restaurar="${esc(id)}">Restaurar</button></div>`).join("")}</div>`
    : `<p class="full" style="margin:0">A lixeira está vazia. O que for excluído fica aqui por 30 dias.</p>`, "Fechar"));
  $("#frm").addEventListener("submit", e => { e.preventDefault(); closeDlg(); });
  $("#frm").addEventListener("click", e => { const b = e.target.closest("[data-restaurar]"); if (b){ restaurar(b.dataset.restaurar); lixeiraForm(); } });

async function migrarPrivado(id){
  try {

    if (flag.exists) return;
    const snap = await priv.limit(1000).get();
    const docs = snap.docs.filter(d => d.id !== "_migrado" && idOk(d.id));
    if (docs.length){
      const have = new Set((await col.limit(1000).get()).docs.map(d => d.id));
      for (const d of docs){ const o = d.data(); if (!have.has(d.id) && (o.kind === "cliente" || o.kind === "condo" || o.kind === "op")) await col.doc(d.id).set(o); }
    }
    await priv.doc("_migrado").set({em: new Date().toISOString(), qtd: docs.length});
  } catch(e){ console.warn("migração", e); }
}
const SRVK = "condcred.app.servidor", TOKK = "condcred.app.sessao", CACHEK = "condcred.app.cache";
let SERVER = null, TOK = null, versaoAtual = null, pinGate = false, pinMsg = "", trocarSrv = false, pendentes = 0, pollT = null, offline = false;

let tCache = null;
function salvarCache(){ clearTimeout(tCache); tCache = setTimeout(() => { if (!TOK) return; try {
  const docs = [];
  [["clientes","cliente"],["condos","condo"],["ops","op"]].forEach(([b, k]) => Object.values(S[b]).forEach(o => docs.push({id: o.id, json: JSON.stringify(Object.assign({}, o, {kind: k}))})));
  Object.entries(LIXO).forEach(([id, o]) => docs.push({id, json: JSON.stringify(o)}));
  if (ultimoBackup) docs.push({id: "_backup", json: JSON.stringify({kind: "meta", em: ultimoBackup})});
  localStorage.setItem(CACHEK, JSON.stringify({versao: versaoAtual, docs}));
} catch(e){} }, 300); }
const escrever = (fn, ...a) => { pendentes++; return api(fn, TOK, ...a).then(r => { salvarCache(); return r; }).finally(() => pendentes--); };

function voltarAoPin(msg){
  TOK = null; lsSet(TOKK, null); lsSet(CACHEK, null); clearInterval(pollT);
  S = {clientes:{}, condos:{}, ops:{}}; BASE = {clientes:{}, condos:{}, ops:{}}; LIXO = {};
  pinGate = true; pinMsg = msg || ""; ready = true; closeDrawer(); try { if ($("#dlg").open) $("#dlg").close(); } catch(e){} render();
}
function aplicar(res, doCache){
  const raw = {clientes:{}, condos:{}, ops:{}}, lixo = {}, venceu = [], limite = Date.now() - 30 * 864e5;
  (res.docs || []).forEach(d => { let o; try { o = JSON.parse(d.json); } catch(e){ return; } if (!o || typeof o !== "object" || !idOk(d.id)) return; o.id = d.id; const k = o.kind;
    if (k === "cliente" || k === "condo" || k === "op") raw[bucket(k)][d.id] = o;
    else if (k === "lixo" && o.orig && (o.origKind === "op" || o.origKind === "cliente" || o.origKind === "condo")){
      if (Date.parse(o.excluidoEm) < limite) venceu.push(d.id);
      else lixo[d.id] = {kind: "lixo", origKind: o.origKind, excluidoEm: isoOk(String(o.excluidoEm).slice(0, 10)) ? String(o.excluidoEm).slice(0, 30) : "", orig: o.origKind === "op" ? cleanOp(o.orig) : cleanParty(o.orig)};
    } else if (k === "meta" && d.id === "_backup" && typeof o.em === "string") ultimoBackup = o.em.slice(0, 30); });
  LIXO = lixo; BASE = cleanAll(raw); CHUNKS = {}; ARQ_IDX = {}; juntar(); versaoAtual = res.versao; ready = true; render();
  if (doCache){ salvarCache(); venceu.forEach(id => col.doc(id).delete().catch(() => {})); }
}
async function carregar(){
  setSave("busy", "Sincronizando…");
  try { aplicar(await api("carregar", TOK), true); offline = false; setSave("ok", savedLabel()); }
  catch(e){
    if (/sessao/.test(e.message)) return;
    offline = true;
    const c = (() => { try { return JSON.parse(localStorage.getItem(CACHEK)); } catch(x){ return null; } })();
    if (c) aplicar(c, false); else { ready = true; render(); }

  }
}

function vigiar(){
  clearInterval(pollT);
  pollT = setInterval(async () => {
    if (!TOK || pendentes || document.hidden || $("#dlg").open) return;
    try { const v = await api("versao", TOK); if ((v !== versaoAtual || offline) && !pendentes) await carregar(); }

}

async function entrarComPin(pin, lembrar, srv){

  if (!SERVER){ pinMsg = "Informe o endereço do servidor."; render(); return; }
  pinMsg = "Entrando…"; render();

let fCli = "", fCon = "", fSt = "";
function opHay(op){ return norm([cliName(op.clienteId), conName(op.condoId), op.servico, op.obs, ...(op.nfs||[]).map(n => "nf " + n.numero), ...(op.boletos||[]).map(b => b.numero)].join(" ")); }
function filtersOn(){ return !!(fCli || fCon || fSt || q.trim()); }
function allOps(){
  const nq = norm(q);
  return Object.values(D().ops)
    .filter(op => (!fCli || op.clienteId === fCli) && (!fCon || op.condoId === fCon) && (!fSt || calcOp(op).status === fSt) && (!nq || opHay(op).includes(nq)))
    .sort((a,b) => (b.data||"").localeCompare(a.data||""));
}
function filterBar(){
  const cls = Object.values(D().clientes).sort((a,b) => a.nome.localeCompare(b.nome, "pt-BR", {sensitivity:"base"}));
  const cns = Object.values(D().condos).sort((a,b) => a.nome.localeCompare(b.nome, "pt-BR", {sensitivity:"base"}));

    <label class="fl"><span>Condomínio</span><select data-filter="con"><option value="">Todos os condomínios</option>${cns.map(c => `<option value="${c.id}" ${fCon===c.id?"selected":""}>${esc(c.nome)}</option>`).join("")}</select></label>
    <label class="fl"><span>Prestador</span><select data-filter="cli"><option value="">Todos os prestadores</option>${cls.map(c => `<option value="${c.id}" ${fCli===c.id?"selected":""}>${esc(c.nome)}</option>`).join("")}</select></label>
    <label class="fl"><span>Situação</span><select data-filter="st"><option value="">Todas</option>${[["aberto","Em dia"],["atrasado","Em atraso"],["quitada","Quitadas"]].map(([v,l]) => `<option value="${v}" ${fSt===v?"selected":""}>${l}</option>`).join("")}</select></label>

function noResults(){ return `<div class="panel empty"><h3>Nenhuma antecipação com esses filtros</h3><p>Mude o condomínio, o prestador, a situação ou o texto da busca.</p><div class="actions"><button class="btn" data-act="limpar">Limpar filtros</button></div></div>`; }
function visibleParties(kind){
  const b = kind === "cli" ? "clientes" : "condos", key = kind === "cli" ? "clienteId" : "condoId", sel = kind === "cli" ? fCli : fCon;
  const ids = new Set(allOps().map(o => o[key]));
  return Object.values(D()[b]).filter(c => (!sel || c.id === sel) && (!filtersOn() || ids.has(c.id) || (q.trim() && !fCli && !fCon && !fSt && norm(c.nome + " " + (c.doc||"")).includes(norm(q)))))
    .sort((a,b) => a.nome.localeCompare(b.nome, "pt-BR", {sensitivity:"base"}));

function cliName(id){ const c = D().clientes[id]; return c ? c.nome : "—"; }
function conName(id){ const c = D().condos[id]; return c ? c.nome : "—"; }
function allBoletos(){
  const out = [];

}

/* ---------- KPIs ---------- */
function kpisHTML(ops){
  const t = totals(ops), hoje = today(), em30 = iso(new Date(Date.now() + 30*864e5));
  const bols = []; ops.forEach(op => (op.boletos||[]).forEach(b => bols.push({op, b, st: statusBoleto(b), e: encargos(b)})));
  const vencidos = bols.filter(x => x.b.vencimento && x.b.vencimento < hoje);
  const valVencido = vencidos.reduce((s,x) => s + x.b.valor, 0);
  const inad = valVencido ? t.atrasado / valVencido : 0;
  const pagos = bols.filter(x => x.st === "pago");
  const pontuais = pagos.filter(x => !x.b.vencimento || x.b.pagoEm <= x.b.vencimento).length;
  const pont = pagos.length ? pontuais / pagos.length : 0;
  const atr = bols.filter(x => x.st === "atrasado");
  const diasAtr = atr.length ? atr.reduce((s,x) => s + x.e.dias, 0) / atr.length : 0;
  let pw = 0, pv = 0; bols.forEach(x => { if (x.b.vencimento && x.op.data){ pw += daysBetween(x.op.data, x.b.vencimento) * x.b.valor; pv += x.b.valor; } });
  const prazo = pv ? pw / pv / 30 : 0;
  const prox30 = bols.filter(x => x.st === "aberto" && x.b.vencimento >= hoje && x.b.vencimento <= em30).reduce((s,x) => s + x.b.valor, 0);
  const porCon = {}; bols.filter(x => x.st !== "pago").forEach(x => porCon[x.op.condoId] = (porCon[x.op.condoId]||0) + x.b.valor);
  const topCon = Object.entries(porCon).sort((a,b) => b[1]-a[1])[0];
  const conc = topCon && t.aberto ? topCon[1] / t.aberto : 0;
  const mesAtual = hoje.slice(0,7), dPrev = new Date(); dPrev.setDate(1); dPrev.setMonth(dPrev.getMonth()-1); const mesAnt = iso(dPrev).slice(0,7);
  const antMes = k => ops.filter(o => (o.data||"").slice(0,7) === k).reduce((s,o) => s + calcOp(o).liquido, 0);
  const aM = antMes(mesAtual), aP = antMes(mesAnt);
  const nCli = new Set(ops.map(o => o.clienteId)).size, nCon = new Set(ops.map(o => o.condoId)).size;
  const quit = ops.filter(o => calcOp(o).status === "quitada").length;
  const tone = (v, bom, ruim, inverso) => inverso ? (v >= ruim ? "bad" : v >= bom ? "mid" : "good") : (v >= bom ? "good" : v >= ruim ? "mid" : "bad");
  const k = (label, value, note, bar, cls) => `<div class="kpi ${cls||""}"><div class="kl">${label}</div><div class="kv num">${value}</div>${bar != null ? `<div class="kbar"><i style="width:${Math.max(2, Math.min(100, bar*100))}%"></i></div>` : ""}<div class="kn">${note}</div></div>`;
  return `<section class="kpis" aria-label="Indicadores">
    ${k("Rentabilidade da carteira", pct(t.capital ? t.receita / t.capital * 100 : 0), t.tarifa || t.iof ? "deságio + tarifas − IOF, sobre o capital aplicado" : "deságio sobre o capital antecipado", null, "hl")}
    ${(() => { let base = 0; ops.forEach(o => { const c = calcOp(o); base += c.nominal * c.prazo; }); return k("Taxa média ao mês", pct(base ? t.desagio / base * 100 : 0), "deságio dividido pelo prazo médio das parcelas"); })()}
    ${k("Deságio médio (total)", pct(t.nominal ? t.desagio / t.nominal * 100 : 0), "sobre o valor nominal, no prazo inteiro")}
    ${k("Inadimplência", pct(inad * 100), `${brl(t.atrasado)} de ${brl(valVencido)} já vencidos`, inad, tone(inad, .02, .08, true))}
    ${k("Pontualidade", pct(pont * 100), `${pontuais} de ${pagos.length} boletos pagos em dia`, pont, tone(pont, .9, .7))}
    ${k("Dias médios de atraso", Math.round(diasAtr) + (Math.round(diasAtr) === 1 ? " dia" : " dias"), atr.length ? `em ${atr.length} ${atr.length===1?"boleto vencido":"boletos vencidos"}` : "nenhum boleto atrasado", null, atr.length ? "bad" : "")}
    ${k("Carteira recebida", pct(t.nominal ? (t.nominal - t.aberto) / t.nominal * 100 : 0), `${brl(t.nominal - t.aberto)} de ${brl(t.nominal)}`, t.nominal ? (t.nominal - t.aberto) / t.nominal : 0)}
    ${k("A receber em 30 dias", brl(prox30), "boletos a vencer até " + fmtD(em30))}
    ${k("Prazo médio", prazo.toLocaleString("pt-BR", {maximumFractionDigits:1}) + " meses", "da antecipação ao vencimento")}
    ${k("Ticket médio", brl(ops.length ? t.nominal / ops.length : 0), "valor nominal por antecipação")}
    ${k("Antecipado neste mês", brl(aM), aP ? `${aM >= aP ? "+" : ""}${pct((aM - aP) / aP * 100)} em relação ao mês anterior` : "sem antecipações no mês anterior")}
    ${k("Maior concentração", pct(conc * 100), topCon ? esc(conName(topCon[0])) + " na carteira a receber" : "carteira quitada", conc, tone(conc, .25, .5, true))}
    ${k("Operações", String(ops.length), `${quit} ${quit===1?"quitada":"quitadas"} · ${nCli} ${nCli===1?"prestador":"prestadores"} · ${nCon} ${nCon===1?"condomínio":"condomínios"}`)}
  </section>`;
}

/* ---------- gráfico ---------- */
let chartData = [];
function monthKey(s){ return s ? s.slice(0,7) : null; }
function buildSeries(){
  const ops = allOps(); if (!ops.length) return [];
  const keys = [];
  ops.forEach(op => { keys.push(monthKey(op.data)); (op.boletos||[]).forEach(b => { if (b.pagoEm) keys.push(monthKey(b.pagoEm)); }); });
  const now = monthKey(today()); keys.push(now);
  const valid = keys.filter(Boolean).sort();
  let start = valid[0];
  const end = now > valid[valid.length-1] ? now : valid[valid.length-1];
  const months = []; let [y,m] = start.split("-").map(Number);
  while (true){ const k = y + "-" + pad(m); months.push(k); if (k >= end) break; m++; if (m > 12){ m = 1; y++; } }
  const series = months.map(k => {
    const last = k + "-31";
    let ant = 0, rec = 0, saldo = 0;
    ops.forEach(op => {
      const c = calcOp(op);
      if (monthKey(op.data) === k) ant += c.liquido;
      if ((op.data||"") <= last){
        let pagoAte = 0;
        (op.boletos||[]).forEach(b => { if (b.pagoEm && b.pagoEm <= last) pagoAte += b.valor; if (b.pagoEm && monthKey(b.pagoEm) === k) rec += (b.valorPago != null ? +b.valorPago : b.valor + encargos(b).total); });
        saldo += Math.max(0, c.nominal - pagoAte);
      }
    });
    return {k, ant, rec, saldo};
  });
  return periodo ? series.slice(-periodo) : series;
}
function smooth(pts){
  if (pts.length < 2) return pts.length ? `M${pts[0][0]},${pts[0][1]}` : "";
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for (let i = 0; i < pts.length - 1; i++){
    const p0 = pts[i-1] || pts[i], p1 = pts[i], p2 = pts[i+1], p3 = pts[i+2] || p2, t = .18;
    d += ` C${p1[0] + (p2[0]-p0[0])*t},${p1[1] + (p2[1]-p0[1])*t} ${p2[0] - (p3[0]-p1[0])*t},${p2[1] - (p3[1]-p1[1])*t} ${p2[0]},${p2[1]}`;
  }
  return d;
}
function chartSVG(){
  chartData = buildSeries();
  const W = 900, H = 300, L = 70, R = 16, T = 18, B = 34;
  const n = chartData.length || 1;
  const maxV = Math.max(1, ...chartData.map(d => Math.max(d.ant, d.rec, d.saldo)));
  const nice = (() => { const p = Math.pow(10, Math.floor(Math.log10(maxV))); const f = maxV / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p; })();
  const y = v => T + (H - T - B) * (1 - v / nice);
  const slot = (W - L - R) / n, bw = Math.min(30, slot * .32);
  const cx = i => L + slot * i + slot / 2;
  let g = "";
  for (let i = 0; i <= 4; i++){ const v = nice * i / 4, yy = y(v); g += `<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="var(--line)" ${i ? 'stroke-dasharray="3 5"' : ""}/><text x="${L-10}" y="${yy+4}" text-anchor="end" font-size="12" fill="var(--muted)">${brlK(v)}</text>`; }
  let bars = "", labels = "", hits = "";
  const every = Math.ceil(n / 12);
  chartData.forEach((d,i) => {
    const x = cx(i);
    bars += `<rect x="${x - bw - 1}" y="${y(d.ant)}" width="${bw}" height="${Math.max(0, y(0) - y(d.ant))}" rx="3" fill="var(--green)"/>`;
    bars += `<rect x="${x + 1}" y="${y(d.rec)}" width="${bw}" height="${Math.max(0, y(0) - y(d.rec))}" rx="3" fill="var(--gold-soft)" stroke="var(--gold)" stroke-width="1"/>`;
    if (i % every === 0 || i === n-1){ const [yy,mm] = d.k.split("-"); labels += `<text x="${x}" y="${H-10}" text-anchor="middle" font-size="12" fill="var(--muted)">${MES[+mm-1]}${mm==="01"||i===0 ? "/" + yy.slice(2) : ""}</text>`; }
    hits += `<rect class="hit" data-i="${i}" x="${L + slot*i}" y="${T}" width="${slot}" height="${H-T-B}" fill="transparent"/>`;
  });
  const pts = chartData.map((d,i) => [cx(i), y(d.saldo)]);
  const line = smooth(pts);
  const area = pts.length ? line + ` L${pts[pts.length-1][0]},${y(0)} L${pts[0][0]},${y(0)} Z` : "";
  const lastPt = pts[pts.length-1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico do valor gerido por mês">
    <defs>
      <linearGradient id="gLine" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="var(--green-2)"/><stop offset=".72" stop-color="var(--green-2)"/><stop offset="1" stop-color="var(--gold)"/></linearGradient>
      <linearGradient id="gArea" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--gold)" stop-opacity=".16"/><stop offset="1" stop-color="var(--gold)" stop-opacity="0"/></linearGradient>
    </defs>
    ${g}${bars}
    <path d="${area}" fill="url(#gArea)"/>
    <path d="${line}" fill="none" stroke="url(#gLine)" stroke-width="3" stroke-linecap="round"/>
    ${lastPt ? `<circle cx="${lastPt[0]}" cy="${lastPt[1]}" r="5" fill="var(--gold)" stroke="var(--surface)" stroke-width="2"/>` : ""}
    ${labels}${hits}
  </svg>`;
}
function wireChart(){
  const wrap = $("#chartWrap"); if (!wrap) return;
  const tip = $("#tip"), svg = wrap.querySelector("svg");
  const show = e => {
    const r = e.target.closest(".hit"); if (!r){ tip.style.opacity = 0; return; }
    const d = chartData[+r.dataset.i]; const [yy,mm] = d.k.split("-");
    const box = r.getBoundingClientRect(), wb = wrap.getBoundingClientRect();
    tip.innerHTML = `<b>${MES[+mm-1]}/${yy}</b><br>Antecipado: ${brl(d.ant)}<br>Recebido: ${brl(d.rec)}<br>Carteira: ${brl(d.saldo)}`;
    tip.style.left = Math.min(wb.width - 90, Math.max(90, box.left - wb.left + box.width/2)) + "px"; tip.style.top = (box.top - wb.top + 30) + "px"; tip.style.opacity = 1;
  };
  svg.addEventListener("mousemove", show); svg.addEventListener("click", show);
  svg.addEventListener("mouseleave", () => tip.style.opacity = 0);
}

  </table></div>`;

    <div><div class="rp-kick">Relatório de antecipação de recebíveis</div><h1>${esc(cliName(op.clienteId))}</h1>

    <span class="rp-st ${st}">${stTxt}</span></header>
  <section class="rp-hero">
    <div><div class="k">Valor nominal (serviço)</div><div class="v">${brl(c.nominal)}</div><div class="d">${c.qtd} ${c.qtd === 1 ? "parcela" : "parcelas"}</div></div>
    <div><div class="k">Deságio (juros)</div><div class="v">${brl(jur)}</div><div class="d">${pct(op.desagioPct)} no total · ${pct(bd.taxaMes * 100)} a.m.</div></div>
    <div><div class="k">IOF + tarifa</div><div class="v">${brl(iofT + c.tarifa)}</div><div class="d">IOF pago por ${c.iofPrest ? "prestador" : "CONDCRED"}</div></div>
    <div class="hl"><div class="k">Líquido ao prestador</div><div class="v">${brl(liq)}</div><div class="d">valor creditado em ${fmtD(op.data)}</div></div>
  </section>
  <div class="rp-2">
    <section class="rp-sec"><h2>Partes</h2><dl class="rp-dl">
      <dt>Cedente (prestador)</dt><dd>${esc(cli.nome || cliName(op.clienteId))}</dd>
      ${cli.doc ? `<dt>CNPJ / CPF</dt><dd>${esc(cli.doc)}</dd>` : ""}${cli.contato ? `<dt>Contato</dt><dd>${esc(cli.contato)}</dd>` : ""}
      <dt>Condomínio (devedor)</dt><dd>${esc(con.nome || conName(op.condoId))}</dd>
      ${con.doc ? `<dt>CNPJ do condomínio</dt><dd>${esc(con.doc)}</dd>` : ""}${con.sindico ? `<dt>Síndico</dt><dd>${esc(con.sindico)}</dd>` : ""}
      <dt>Cessionária</dt><dd>CONDCRED</dd></dl></section>
    <section class="rp-sec"><h2>Premissas da operação</h2><dl class="rp-dl">
      <dt>Data do crédito</dt><dd>${fmtD(op.data)}</dd>
      <dt>Taxa de juros ao mês</dt><dd>${pct(bd.taxaMes * 100)}</dd>
      <dt>Prazo médio</dt><dd>${(c.prazo || 0).toLocaleString("pt-BR", {maximumFractionDigits: 2})} meses</dd>
      <dt>Critério dos juros</dt><dd>Simples, pro rata die</dd>
      <dt>Tipo do prestador (IOF)</dt><dd>${esc(IOF_REG[op.iofRegime] || "—")}</dd>
      <dt>IOF diário · adicional</dt><dd>${p5(op.iofTaxaDia || bd.dia)} · ${p5(op.iofTaxaAd || bd.ad)}</dd>
      <dt>IOF pago por</dt><dd>${c.iofPrest ? "Prestador" : "CONDCRED"}</dd>
      <dt>Tarifa de abertura</dt><dd>${brl(c.tarifa)}</dd></dl></section>
  </div>
  ${op.servico || op.obs ? `<section class="rp-sec"><h2>Serviço e observações</h2>${op.servico ? `<div class="rp-txt"><b>Serviço:</b> ${esc(op.servico)}</div>` : ""}${op.obs ? `<div class="rp-txt" style="margin-top:8px"><b>Observações:</b> ${esc(op.obs)}</div>` : ""}</section>` : ""}
  ${bd.linhas.length ? `<section class="rp-sec"><h2>Borderô <span style="font:400 12px/1 system-ui,sans-serif;letter-spacing:0;text-transform:none;color:#6b6b63">(valores em R$)</span></h2><div class="rp-tw"><table><thead><tr><th>Parcela</th><th>Vencimento</th><th class="n">Dias</th><th class="n">Valor nominal</th><th class="n">Juros</th><th class="n">Base líquida IOF</th><th class="n">IOF diário</th><th class="n">IOF adicional</th><th class="n">IOF</th><th class="n">Líquido</th></tr></thead><tbody>
    ${bd.linhas.map((l, i) => `<tr><td>${i + 1}</td><td>${fmtD(l.venc)}</td><td class="n">${l.dias}</td><td class="n">${nb(l.v)}</td><td class="n">${nb(l.juros)}</td><td class="n">${nb(l.base)}</td><td class="n">${nb(l.iofD)}</td><td class="n">${nb(l.iofA)}</td><td class="n">${nb(l.iof)}</td><td class="n">${nb(l.base - (c.iofPrest ? l.iof : 0))}</td></tr>`).join("")}

    <section class="rp-sec"><h2>Resumo da operação</h2><dl class="rp-dl">

      <dt>Total de juros (deságio)</dt><dd>${brl(jur)}</dd>
      <dt>IOF diário</dt><dd>${brl(c.iofDiario || bd.diario)}</dd>
      <dt>IOF adicional</dt><dd>${brl(c.iofAdicional || bd.adicional)}</dd>

function opForm(op){

    <label class="f full">Observações<textarea name="obs" rows="2" maxlength="500">${esc(op.obs||"")}</textarea></label>

  const f = $("#frm"), err = $("#ferr");

    if (!isoOk(f.vencimento.value)){ $("#ferr").textContent = "Informe o vencimento."; return; }
    const o = JSON.parse(JSON.stringify(op)); const nb = {id: b.id || uid("b"), numero: f.numero.value.trim().slice(0,20), vencimento: f.vencimento.value, valor: num(f.valor.value)};
    if (f.pagoEm.value){ nb.pagoEm = f.pagoEm.value; if (f.valorPago.value.trim()) nb.valorPago = num(f.valorPago.value); }
    if (edit) o.boletos = o.boletos.map(x => x.id === b.id ? nb : x); else o.boletos.push(nb);
    o.boletos.sort((a,c) => (a.vencimento||"").localeCompare(c.vencimento||"")); persist("op", o); closeDlg(); toast("Boleto salvo"); });
}

function setPaid(opId, bId, paid){
  const op = D().ops[opId]; if (!op) return;
  const o = JSON.parse(JSON.stringify(op));
  o.boletos = o.boletos.map(b => { if (b.id !== bId) return b; if (paid){ b.pagoEm = today(); delete b.valorPago; } else { delete b.pagoEm; delete b.valorPago; } return b; });
  persist("op", o); toast(paid ? "Boleto marcado como pago" : "Pagamento desfeito");
}

/* ================= exportação ================= */
let downloads = null;
// impede que um texto começando com = + - @ vire fórmula ao abrir no Excel
function csvCell(v){ v = String(v == null ? "" : v); if (/^[=+\-@\t\r]/.test(v) && !/^-?\d[\d.,]*$/.test(v)) v = "'" + v; return `"${v.replace(/"/g,'""')}"`; }
async function exportCSV(){
  const sep = ";", n2 = v => (+v||0).toFixed(2).replace(".",",");
  const lines = [["Prestador","Condomínio","Serviço","Data","Valor nominal","Deságio total %","Taxa ao mês %","Deságio R$","Regime IOF","IOF pago por","IOF diário","IOF adicional","IOF total","Tarifa","Líquido ao prestador","Recebido","A receber","Encargos","Total no final","Boleto","Vencimento","Valor boleto","Situação","Pago em"].join(sep)];
  allOps().forEach(op => { const c = calcOp(op); (op.boletos.length ? op.boletos : [{}]).forEach(b => {
    lines.push([cliName(op.clienteId), conName(op.condoId), op.servico||"", fmtD(op.data), n2(c.nominal), n2(op.desagioPct), n2(c.taxaMes), n2(c.desagio), IOF_REG[op.iofRegime] || "", c.iof ? (c.iofPrest ? "Prestador" : "CONDCRED") : "", n2(c.iofDiario), n2(c.iofAdicional), n2(c.iof), n2(c.tarifa), n2(c.liquido), n2(c.recebido), n2(c.aberto), n2(c.encargosTot), n2(c.totalFinal), b.numero||"", b.vencimento ? fmtD(b.vencimento) : "", b.valor != null ? n2(b.valor) : "", b.id ? statusBoleto(b) : "", b.pagoEm ? fmtD(b.pagoEm) : ""].map(csvCell).join(sep)); }); });
  const data = "\ufeff" + lines.join("\r\n");
  await saveFile("condcred-antecipacoes-" + today() + ".csv", data, "text/csv");
}
async function saveFile(filename, data, mime){
  try {
    const f = new File([data], filename, {type: mime});
    if (navigator.canShare && navigator.canShare({files: [f]})){ await navigator.share({files: [f]}); return true; }
  } catch(e){ if (e && e.name === "AbortError"){ toast("Cancelado"); return false; } }
  if (!downloads && window.claude && window.claude.use) downloads = await window.claude.use("downloads");
  if (downloads){ try { await downloads.save({filename, data}); return true; } catch(e){ toast("Download cancelado"); return false; } }
  try {
    const url = URL.createObjectURL(new Blob([data], {type: mime + ";charset=utf-8"}));
    const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000); return true;
  } catch(e){ toast("Exportação indisponível nesta visualização"); return false; }
}
/* backup completo (.json) — serve para levar os dados de um painel para outro */
function backupForm(){
  if (demo){ toast("Saia do exemplo para fazer backup"); return; }
  const n = Object.keys(S.ops).length;
  openDlg(dlgShell("Backup dos dados", `
    <p class="full" style="margin:0">O backup guarda <strong>todas</strong> as antecipações, boletos, NFs, prestadores e condomínios (${n} ${n===1?"antecipação":"antecipações"} hoje). Use para guardar uma cópia ou levar os dados para o outro painel.</p>
    ${mode === "nuvem" ? `<div class="full" style="font-size:14px"><strong>Espaço usado:</strong> ${(nDocs.ativos + nDocs.arquivo).toLocaleString("pt-BR")} de ${CAP_DOCS.toLocaleString("pt-BR")} registros (${Math.round((nDocs.ativos + nDocs.arquivo) / CAP_DOCS * 100)}%)<div class="muted" style="font-size:13px">Antecipações quitadas há mais de 6 meses são agrupadas automaticamente para ocupar menos espaço.</div></div>` : ""}
    <div class="full"><button type="button" class="btn" data-act="bk-down">${ICON_DL}Baixar backup</button></div>
    <label class="f full">Importar um backup<input type="file" name="arq" accept=".json,application/json"></label>
    <p class="full muted" style="margin:0;font-size:13px">A importação soma os dados do arquivo aos que já estão aqui. Nada é apagado; registros iguais são atualizados.</p>
    <p class="err full" id="ferr"></p>
    <div class="full" style="border-top:1px solid var(--line);padding-top:12px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><span class="muted" style="font-size:13px">Conectado ao servidor na sua planilha.</span><button type="button" class="btn ghost" data-act="sair">Sair deste aparelho</button></div>`, "Importar"));
  const f = $("#frm");
  f.addEventListener("submit", e => { e.preventDefault();
    const file = f.arq.files && f.arq.files[0];
    if (!file){ $("#ferr").textContent = "Escolha o arquivo de backup (.json)."; return; }
    if (file.size > 5e6){ $("#ferr").textContent = "Arquivo grande demais para um backup do painel."; return; }
    const rd = new FileReader();
    rd.onload = () => {
      let d; try { const j = JSON.parse(rd.result); d = cleanAll(j && j.dados ? j.dados : j); } catch(err){ $("#ferr").textContent = "Este arquivo não é um backup válido do painel."; return; }
      const qOps = Object.keys(d.ops).length, qP = Object.keys(d.clientes).length + Object.keys(d.condos).length;
      if (!qOps && !qP){ $("#ferr").textContent = "O arquivo não tem dados para importar."; return; }
      closeDlg();
      ask(`Importar ${qOps} ${qOps===1?"antecipação":"antecipações"} e ${qP} cadastros de prestadores/condomínios?`, "Importar", true).then(ok => {
        if (!ok) return;
        Object.values(d.clientes).forEach(o => persist("cliente", o));
        Object.values(d.condos).forEach(o => persist("condo", o));
        Object.values(d.ops).forEach(o => persist("op", o));
        toast("Backup importado");
      });
    };
    rd.readAsText(file);
  });
}
async function baixarBackup(){
  if (demo){ toast("Saia do exemplo para fazer backup"); return; }
  const ok = await saveFile("condcred-backup-" + today() + ".json", JSON.stringify({app: "condcred-painel", versao: 1, geradoEm: new Date().toISOString(), dados: S, lixeira: LIXO}, null, 1), "application/json");
  if (ok && col){ ultimoBackup = new Date().toISOString(); render(); col.doc("_backup").set({kind: "meta", em: ultimoBackup}).catch(() => {}); toast("Backup baixado — guarde o arquivo em local seguro"); }
}

/* ================= exemplo ================= */
function makeDemo(){
  const d = {clientes:{}, condos:{}, ops:{}};
  const cl = ["Construtora Recife Norte","Elevadores Boa Viagem","Pinturas & Fachadas PE"].map((nome,i) => ({id:"cli_d"+i, nome, doc:"", contato:""}));
  const co = ["Cond. Edf. Mar Azul","Cond. Jardim Imbiribeira","Cond. Torres do Capibaribe","Cond. Parque das Graças"].map((nome,i) => ({id:"con_d"+i, nome, doc:"", sindico:""}));
  cl.forEach(c => d.clientes[c.id] = c); co.forEach(c => d.condos[c.id] = c);
  const spec = [[0,0,"Reforma da fachada",200000,12,-9,10],[1,1,"Modernização de elevadores",96000,10,-7,8],[2,2,"Pintura das áreas comuns",54000,9,-5,6],[0,3,"Impermeabilização da coberta",138000,11,-3,10],[1,0,"Troca de cabos e polias",42000,8,-2,6]];
  spec.forEach(([ci,cj,serv,val,des,mOff,par],k) => {
    const data = addMonths(today(), mOff); const op = {id:"op_d"+k, clienteId:cl[ci].id, condoId:co[cj].id, servico:serv, valorNominal:val, desagioPct:des, data, boletos:[], nfs:[{id:"nf_d"+k, tipo:"prestador", numero:String(1040+k), data, valor:val}]};
    for (let i = 0; i < par; i++){ const venc = addMonths(data, i+1); const b = {id:"b_d"+k+"_"+i, numero:pad(i+1)+"/"+pad(par), vencimento:venc, valor: val/par};
      const atras = (k === 1 && i === 4) || (k === 2 && i === 3);
      if (venc < today() && !atras) b.pagoEm = venc;
      op.boletos.push(b); }
    { const bd = bordero(op.data, op.boletos.map(b => [b.valor, b.vencimento]), val, des, "pj");
      Object.assign(op, {iofRegime: "pj", iofPagador: "condcred", tarifa: TARIFA_PADRAO, iof: bd.total, iofDiario: bd.diario, iofAdicional: bd.adicional, iofTaxaDia: bd.dia, iofTaxaAd: bd.ad}); }
    d.ops[op.id] = op;
  });
  return d;
}

/* ================= eventos ================= */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-view],[data-act],[data-op],[data-pay],[data-unpay],[data-edit-cli],[data-edit-con],[data-edit-bol],[data-del-nf],[data-filter-cli],[data-filter-con],[data-bf],[data-periodo]");
  if (!t) return;
  const ds = t.dataset;
  if (ds.view && t.closest("#nav,.panel,.top")){ view = ds.view; closeDrawer(); render(); window.scrollTo(0,0); return; }
  if (ds.periodo != null){ periodo = +ds.periodo; render(); return; }
  if (ds.bf){ boletoFiltro = ds.bf; render(); return; }
  if (ds.pay){ const [o,b] = ds.pay.split("|"); setPaid(o,b,true); return; }
  if (ds.unpay){ const [o,b] = ds.unpay.split("|"); setPaid(o,b,false); return; }
  if (ds.editCli){ partyForm("cliente", D().clientes[ds.editCli]); return; }
  if (ds.editCon){ partyForm("condo", D().condos[ds.editCon]); return; }
  if (ds.filterCli){ view = "ops"; fCli = ds.filterCli; render(); return; }
  if (ds.filterCon){ view = "ops"; fCon = ds.filterCon; render(); return; }
  if (ds.editBol){ const op = D().ops[drawerOp]; boletoForm(op, op.boletos.find(b => b.id === ds.editBol)); return; }
  if (ds.delNf){ const o = JSON.parse(JSON.stringify(D().ops[drawerOp])); o.nfs = o.nfs.filter(n => n.id !== ds.delNf); persist("op", o); return; }
  if (ds.op && !ds.act){ openDrawer(ds.op); return; }
  switch (ds.act){
    case "nova-op": opForm(); break;
    case "novo-cli": partyForm("cliente"); break;
    case "novo-con": partyForm("condo"); break;
    case "close-dlg": closeDlg(); break;
    case "fechar": closeDrawer(); break;
    case "add-boleto": boletoForm(D().ops[drawerOp]); break;
    case "add-nf": nfForm(D().ops[drawerOp]); break;
    case "edit-op": opForm(D().ops[drawerOp]); break;
    case "relatorio": abrirRelatorio(D().ops[drawerOp]); break;
    case "planilha-op": baixarPlanilhaOp(D().ops[drawerOp]); break;
    case "rep-close": fecharRelatorio(); break;
    case "rep-print": imprimirRelatorio(); break;
    case "rep-xlsx": baixarPlanilhaOp(D().ops[repOp]); break;
    case "rep-html": baixarRelatorioHTML(); break;
    case "rep-int": repInterno = !repInterno; abrirRelatorio(D().ops[repOp]); break;
    case "del-op": { const id = drawerOp; ask("Excluir esta antecipação, com todos os boletos e NFs?", "Excluir antecipação").then(ok => { if (ok){ closeDrawer(); removeItem("op", id); toast("Antecipação excluída"); } }); } break;
    case "export": exportCSV(); break;
    case "sair": sair(); break;
    case "trocar-srv": trocarSrv = true; pinMsg = ""; render(); break;
    case "backup": backupForm(); break;
    case "lixeira": lixeiraForm(); break;
    case "bk-down": baixarBackup(); break;
    case "discreto": discreto = !discreto; try { localStorage.setItem("condcred.discreto", discreto ? "1" : "0"); } catch(e){} document.body.classList.toggle("discreto", discreto); render(); break;
    case "demo": fCli = fCon = fSt = ""; q = ""; demo = makeDemo(); render(); break;
    case "limpar": fCli = fCon = fSt = ""; q = ""; render(); break;
    case "sair-demo": fCli = fCon = fSt = ""; q = ""; demo = null; closeDrawer(); render(); break;
  }
});
